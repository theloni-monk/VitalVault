[package]
name = "vitalvault"
version = "0.1.0"
description = "VitalVault is a platform for secure local storage and semantic retrival of medical documents"
authors = ["thelonious cooper<theloni@berkeley.edu>"]
license = "Affero GPLv3"
repository = "https://github.com/theloni-monk/VitalVault"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "vitalvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }
tauri-typegen = "0.4.2"

[dependencies]
oxidize-pdf = "1.7.1"
tauri-plugin-biometry = "0.2.6"
serde = {version="*", features= ["derive"] }
derive_more = { version = "2.1.1", features = ["debug"] }
log = "0.4.29"
tauri = { version = "2.10.2", features = [] }
tauri-plugin-log = "2.8.0"
uuid = "1.21.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-stronghold = "2.3.1"
tauri-plugin-biometric = "2.3.2"
serde_json = "1.0.149"
async-trait = "0.1.89"
oxicode = { version = "0.1", features = ["serde", "simd", "compression", "async-tokio"] }
burn = { version = "0.20.1", features = ["wgpu"] }
serde_with = "3.16.1"
tokio = {version="1.49.0", features= ["macros"] }
duckdb = { version = "1.3.2", features = ["bundled"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2.3.2"
